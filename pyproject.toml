[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "django-service-urls"
description = "setting helper for django to represent databases, caches and email settings via a single string"
authors = [
    {name = "Raffaele Salmaso", email = "raffaele@salmaso.org"},
]
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [
    "version",
]
dependencies = [
    "django",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.2",
    "mypy>=1.20.0",
    "nox[uv]>=2026.2.9",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]
django52 = [ "django>=5.2,<6.0 ; python_version>='3.10'", "psycopg[binary]" ]
django60 = [ "django>=6.0,<6.1 ; python_version>='3.12'", "psycopg[binary]" ]
djangomain = ["django @ git+https://github.com/django/django@main ; python_version>='3.12'", "psycopg[binary]"]

[tool.uv]
conflicts = [[
    { group = "django52" },
    { group = "django60" },
    { group = "djangomain" },
]]
# Ensure Nox always gets a fresh package.
reinstall-package = ["django-service-urls"]

[project.urls]
"Home Page" = "https://pypi.org/project/django-service-urls/"
Documentation = "https://github.com/rsalmaso/django-service-urls/blob/main/README.md"
GitHub = "https://github.com/rsalmaso/django-service-urls"
Changelog = "https://github.com/rsalmaso/django-service-urls/blob/main/CHANGELOG.md"
"Bug Reports" = "https://github.com/rsalmaso/django-service-urls/discussions"

[tool.hatch.version]
path = "django_service_urls/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C9", # mccabe
    "DJ", # flake8-django
    "E", # pycodestyle
    "F", # pyflakes
    "I", #
    "W", # pycodestyle

]
ignore = [
    "B904", # Within an except clause, raise exceptions with raise ... from err or raise ... from None to
            # distinguish them from errors in exception handling.
    "E722", # Do not use bare except, specify exception instead
]
fixable = [
    "I",
]
unfixable = [
    "F401", # don't remove unused import
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
force-wrap-aliases = true
known-first-party = [
    "django_service_urls",
]
known-third-party = [
    "django",
]
order-by-type = false

[tool.ruff.lint.mccabe]
max-complexity = 18
